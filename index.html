#toast.on{opacity:1;transform:translateX(-50%)}

function todayISO(){ return new Date().toISOString().slice(0,10); }
function backupJSON(){ return JSON.stringify(DB, null, 2); }
function mergeImport(inc){
  if(!inc || typeof inc !== "object") throw new Error("invalid backup");
  let added = 0;
  const haveIds = new Set(DB.places.map(p=>p.id));
  (inc.places||[]).forEach(p=>{
    if(p && p.id && !haveIds.has(p.id)){ DB.places.push(p); haveIds.add(p.id); added++; }
  });
  const haveCk = new Set(DB.checklist.map(c=>c.id));
  (inc.checklist||[]).forEach(c=>{
    if(c && c.id && !haveCk.has(c.id)){ DB.checklist.push(c); haveCk.add(c.id); }
  });
  Object.keys(inc.dayMemos||{}).forEach(d=>{
    if(!(d in DB.dayMemos)) DB.dayMemos[d] = inc.dayMemos[d];
  });
  return added;
}
const DOW = ["일","월","화","수","목","금","토"];
const fmtDay = date => `${date.slice(5).replace("-",".")} (${DOW[new Date(date+"T00:00:00").getDay()]})`;

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function uid(p){ return (p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> t.classList.remove("on"), 2200);
}

function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY) || "null");
    if(r && typeof r === "object") return r;
  }catch(e){}
  return {};
}
function migrate(db){
  db.version = 1;
  db.dayMemos = db.dayMemos || {};
  db.dayPlaces = db.dayPlaces || {};
  db.places = Array.isArray(db.places) ? db.places : [];
  db.checklist = Array.isArray(db.checklist) ? db.checklist
    : DEFAULT_CHECKLIST.map(label=>({id:uid("ck"), label, checked:false}));
  if(!db.seededPlaces){
    const have = new Set(db.places.map(p=> p.name+"|"+(p.address||"")));
    SEED_PLACES.forEach(p=>{
      const key = p.name+"|"+(p.address||"");
      if(!have.has(key)){ db.places.push({id:uid("pl"), createdAt:Date.now(), ...p}); have.add(key); }
    });
    db.seededPlaces = true;
  }
  return db;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast("저장 실패 — 저장 공간이 부족할 수 있어요"); }
}
let DB = migrate(load());
save();

function isoLocal(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function dateRange(startISO, endISO){
  const out = [];
  let d = new Date(startISO+"T00:00:00");
  const end = new Date(endISO+"T00:00:00");
  while(d <= end){
    out.push(isoLocal(d));
    d.setDate(d.getDate()+1);
  }
  return out;
}

  ], warning: "체크아웃(10:00)이 출발(08:40)보다 늦어요 — 전날 미리 짐을 싸두거나 새벽에 체크아웃하세요." }
};

const SEGMENTS = {
  "2026-08-17": "✈️ 출국",
  "2026-08-18": "🚕 공항 → 골드코스트 이동",
  "2026-08-19": "🏖 골드코스트",
  "2026-08-20": "🏖 골드코스트",
  "2026-08-21": "🏖 골드코스트",
  "2026-08-22": "🏖 골드코스트",
  "2026-08-23": "🚕 골드코스트 → 브리즈번 이동",
  "2026-08-24": "🏙 브리즈번",
  "2026-08-25": "🏙 브리즈번",
  "2026-08-26": "🏙 브리즈번",
  "2026-08-27": "🚕 브리즈번 → 공항 이동",
};

let dayIdx = 0;
let itinView = "overview";
function daySummary(date){
  const t = TRIP_INFO[date];
  return t && t.info.length ? t.info[0].title : "확정 일정 없음";
}
function renderItin(){
  if(itinView === "overview") renderItinOverview();
  else renderItinDetail();
}
function renderItinOverview(){
  const rows = DAYS.map((date,i)=>{
    const hasWarn = TRIP_INFO[date] && TRIP_INFO[date].warning;
    const seg = SEGMENTS[date];
    const dayLabel = i===0 ? "" : `${i}일차`;
    return `
      <div class="card" data-i="${i}" style="cursor:pointer">
        <div class="chead">
          <b>${fmtDay(date)}</b>
          <span class="cnum">${dayLabel}${hasWarn?" ⚠️":""}</span>
        </div>
        ${seg ? `<span class="chip sm on" style="margin-bottom:6px;display:inline-block">${esc(seg)}</span>` : ""}
        <div class="memoline">${esc(daySummary(date))}</div>
      </div>`;
  }).join("");
  $("#itinBody").innerHTML = `
    <div class="addhead"><span class="ttl">전체 일정</span></div>
    ${rows}
  `;
  $$("#itinBody .card").forEach(el=> el.onclick = ()=>{
    dayIdx = Number(el.dataset.i); itinView = "detail"; renderItin();
  });
}
function renderItinDetail(){
  const date = DAYS[dayIdx];
  const t = TRIP_INFO[date] || {info:[]};
  const infoHtml = t.info.map(x=>`
    <div class="infocard">
      <span class="ic">${x.icon}</span>
      <div class="body"><b>${esc(x.title)}</b><div class="detail">${esc(x.detail)}</div></div>
    </div>`).join("");
  const warnHtml = t.warning ? `<div class="warnbox">⚠️ ${esc(t.warning)}</div>` : "";
  const memo = DB.dayMemos[date] || "";
  const dayPlaces = placesForDay(date);
  const dayPlacesHtml = dayPlaces.length ? dayPlaces.map(p=>`
    <div class="checkrow" data-id="${p.id}">
      <span class="ic" style="flex:none;font-size:16px">${CAT_MAP[p.category]?.ic||"📌"}</span>
      <span class="label">${esc(p.name)}</span>
      <button class="delx">×</button>
    </div>`).join("") : `<div class="empty" style="padding:20px 0"><p>아직 담은 장소가 없어요</p></div>`;
  $("#itinBody").innerHTML = `
    <div class="addhead">
      <button class="iconbtn" id="backToOverview" title="전체 일정으로">‹</button>
      <span class="ttl">전체 일정으로</span>
    </div>
    <div class="dayNav">
      <button class="iconbtn" id="dayPrev" ${dayIdx===0?"disabled":""}>‹</button>
      <span class="dayTtl">${fmtDay(date)}</span>
      <button class="iconbtn" id="dayNext" ${dayIdx===DAYS.length-1?"disabled":""}>›</button>
    </div>
    ${infoHtml || `<div class="empty"><span class="bigem">📅</span><p>이 날은 확정된 일정이 없어요</p></div>`}
    ${warnHtml}
    <div class="addhead" style="margin-top:18px">
      <span class="ttl">오늘 할 일</span>
      <button class="iconbtn" id="addDayPlaceBtn" title="장소에서 담기" style="margin-left:auto">➕</button>
    </div>
    <div id="dayPlaceList">${dayPlacesHtml}</div>
    <label class="fl">오늘의 메모</label>
    <textarea class="inp" id="dayMemo" rows="4" placeholder="오늘 뭐 할지 자유롭게 적어보세요">${esc(memo)}</textarea>
  `;
  $("#backToOverview").onclick = ()=>{ itinView = "overview"; renderItin(); };
  $("#dayPrev").onclick = ()=>{ if(dayIdx>0){ dayIdx--; renderItin(); } };
  $("#dayNext").onclick = ()=>{ if(dayIdx<DAYS.length-1){ dayIdx++; renderItin(); } };
  $("#dayMemo").oninput = e=>{ DB.dayMemos[date] = e.target.value; save(); };
  $("#addDayPlaceBtn").onclick = ()=> openDayPlacePicker(date);
  $$("#dayPlaceList .checkrow").forEach(row=>
    row.querySelector(".delx").onclick = ()=> toggleDayPlace(date, row.dataset.id)
  );
}
function placesForDay(date){
  return ((DB.dayPlaces && DB.dayPlaces[date]) || []).map(id=> DB.places.find(p=>p.id===id)).filter(Boolean);
}
function toggleDayPlace(date, id){
  DB.dayPlaces[date] = DB.dayPlaces[date] || [];
  const idx = DB.dayPlaces[date].indexOf(id);
  if(idx>=0) DB.dayPlaces[date].splice(idx,1);
  else DB.dayPlaces[date].push(id);
  save();
  renderItinDetail();
}
function openDayPlacePicker(date){
  const assigned = new Set(DB.dayPlaces[date] || []);
  const rows = DB.places.length ? DB.places.map(p=>`
    <div class="checkrow" data-id="${p.id}" style="cursor:pointer">
      <button class="checkbox ${assigned.has(p.id)?"on":""}">${assigned.has(p.id)?"✓":""}</button>
      <span class="label">${CAT_MAP[p.category]?.ic||"📌"} ${esc(p.name)}</span>
    </div>`).join("") : `<div class="empty"><span class="bigem">📍</span><p>먼저 장소 탭에서 장소를 추가해보세요</p></div>`;
  $("#sheetHost").innerHTML = `
    <div class="sheet">
      <div class="sheetbar">
        <button class="iconbtn" id="sheetClose">✕</button>
        <span class="ttl">장소에서 담기</span>
      </div>
      <div class="sheetbody">${rows}</div>
    </div>
  `;
  $("#sheetClose").onclick = closeSheet;
  $$("#sheetHost .checkrow").forEach(row=> row.onclick = ()=>{
    toggleDayPlace(date, row.dataset.id);
    openDayPlacePicker(date);
  });
}
const CATEGORIES = [
  {k:"food",  n:"맛집/카페", ic:"🍜"},
  {k:"sight", n:"관광지",   ic:"🏖"},
  {k:"shop",  n:"쇼핑",     ic:"🛍"},
  {k:"move",  n:"교통/이동", ic:"🚌"},
  {k:"etc",   n:"기타",     ic:"📌"},
];
const CAT_MAP = Object.fromEntries(CATEGORIES.map(c=>[c.k,c]));
const CITIES = ["골드코스트","브리즈번","기타"];

function buildMapsUrl(p){
  const q = p.address ? `${p.name} ${p.address}` : p.name;
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}

let placeCat = "all", placeCity = "all";

function assignedPlaceIds(){
  const s = new Set();
  Object.values(DB.dayPlaces||{}).forEach(arr=> (arr||[]).forEach(id=>s.add(id)));
  return s;
}
function renderPlaces(){
  const catChips = [{k:"all",n:"전체",ic:"✨"}, ...CATEGORIES].map(c=>
    `<button class="chip ${placeCat===c.k?"on":""}" data-cat="${c.k}">${c.ic} ${c.n}</button>`
  ).join("");
  const cityChips = ["all",...CITIES].map(c=>
    `<button class="chip ${placeCity===c?"on":""}" data-city="${c}">${c==="all"?"모든 도시":c}</button>`
  ).join("");
  const list = DB.places.filter(p=>
    (placeCat==="all"||p.category===placeCat) && (placeCity==="all"||p.city===placeCity)
  );
  const assigned = assignedPlaceIds();
  const cardsHtml = list.length ? list.map(p=>{
    const done = assigned.has(p.id);
    return `
    <div class="card${done?" done":""}" data-id="${p.id}">
      <div class="chead">
        <span class="ic">${CAT_MAP[p.category]?.ic || "📌"}</span>
        <b class="${done?"strike":""}">${esc(p.name)}</b>
        <span class="cnum">${done?"✓ 담음 · ":""}${esc(p.city)}</span>
      </div>
      ${p.memo ? `<div class="memoline">${esc(p.memo)}</div>` : ""}
      <div class="btnrow" style="margin-top:9px">
        <a class="btn sm" href="${buildMapsUrl(p)}" target="_blank" rel="noopener">🗺 구글맵에서 보기</a>
        <button class="btn sm ghost editBtn">✏️ 수정</button>
      </div>
    </div>`;
  }).join("") : `<div class="empty"><span class="bigem">📍</span><p>아직 저장한 장소가 없어요</p><p>오른쪽 위 ＋ 버튼으로 추가해보세요</p></div>`;

  $("#placesBody").innerHTML = `
    <div class="addhead">
      <span class="ttl">장소</span>
      <button class="iconbtn" id="addPlaceBtn" title="추가" style="margin-left:auto">➕</button>
    </div>
    <div class="chiprow">${catChips}</div>
    <div class="chiprow">${cityChips}</div>
    ${cardsHtml}
  `;
  $$("#placesBody [data-cat]").forEach(b=> b.onclick = ()=>{ placeCat=b.dataset.cat; renderPlaces(); });
  $$("#placesBody [data-city]").forEach(b=> b.onclick = ()=>{ placeCity=b.dataset.city; renderPlaces(); });
  $("#addPlaceBtn").onclick = ()=> openPlaceSheet(null);
  $$("#placesBody .card").forEach(el=> el.querySelector(".editBtn").onclick = ()=> openPlaceSheet(el.dataset.id));
}

function openPlaceSheet(id){
  const editing = DB.places.find(p=>p.id===id) || null;
  $("#sheetHost").innerHTML = `
    <div class="sheet">
      <div class="sheetbar">
        <button class="iconbtn" id="sheetClose">✕</button>
        <span class="ttl">${editing?"장소 수정":"장소 추가"}</span>
      </div>
      <div class="sheetbody">
        <label class="fl">이름</label>
        <input class="inp" id="pfName" value="${editing?esc(editing.name):""}" placeholder="예: Kim's Kitchen">
        <label class="fl">도시</label>
        <select class="inp" id="pfCity">
          ${CITIES.map(c=>`<option value="${c}" ${editing&&editing.city===c?"selected":""}>${c}</option>`).join("")}
        </select>
        <label class="fl">카테고리</label>
        <select class="inp" id="pfCat">
          ${CATEGORIES.map(c=>`<option value="${c.k}" ${editing&&editing.category===c.k?"selected":""}>${c.ic} ${c.n}</option>`).join("")}
        </select>
        <label class="fl">주소 (선택, 구글맵 검색 정확도용)</label>
        <input class="inp" id="pfAddr" value="${editing?esc(editing.address||""):""}" placeholder="예: Surfers Paradise Blvd">
        <label class="fl">메모</label>
        <textarea class="inp" id="pfMemo" rows="3" placeholder="추천 메뉴, 팁 등">${editing?esc(editing.memo||""):""}</textarea>
        <div class="btnrow" style="margin-top:16px">
          <button class="btn primary full" id="pfSave">저장</button>
        </div>
        ${editing?'<button class="btn danger full" id="pfDel" style="margin-top:8px">삭제</button>':""}
      </div>
    </div>
  `;
  $("#sheetClose").onclick = closeSheet;
  $("#pfSave").onclick = ()=>{
    const name = $("#pfName").value.trim();
    if(!name){ toast("이름을 입력해주세요"); return; }
    const data = {
      name,
      city: $("#pfCity").value,
      category: $("#pfCat").value,
      address: $("#pfAddr").value.trim(),
      memo: $("#pfMemo").value.trim(),
    };
    if(editing){
      Object.assign(editing, data);
    } else {
      DB.places.push({ id: uid("pl"), createdAt: Date.now(), ...data });
    }
    save(); closeSheet(); renderPlaces();
    toast(editing?"수정했어요":"저장했어요");
  };
  if(editing){
    $("#pfDel").onclick = ()=>{
      if(!confirm("이 장소를 삭제할까요?")) return;
      DB.places = DB.places.filter(p=>p.id!==editing.id);
      save(); closeSheet(); renderPlaces();
      toast("삭제했어요");
    };
  }
}
function closeSheet(){ $("#sheetHost").innerHTML = ""; }

function renderCheck(){
  const rows = DB.checklist.map(it=>`
    <div class="checkrow" data-id="${it.id}">
      <button class="checkbox ${it.checked?"on":""}">${it.checked?"✓":""}</button>
      <span class="label ${it.checked?"done":""}">${esc(it.label)}</span>
      <button class="delx">×</button>
    </div>
  `).join("");
  $("#checkBody").innerHTML = `
    <div class="addtip">
      <input id="ckNew" placeholder="새 준비물 입력 후 Enter">
      <button id="ckAddBtn">추가</button>
    </div>
    ${rows || `<div class="empty"><span class="bigem">🎒</span><p>준비물이 없어요</p></div>`}
  `;
  $$("#checkBody .checkrow").forEach(row=>{
    const id = row.dataset.id;
    row.querySelector(".checkbox").onclick = ()=> toggleCheck(id);
    row.querySelector(".delx").onclick = ()=> delCheckItem(id);
  });
  const addFn = ()=>{
    const v = $("#ckNew").value.trim();
    if(!v) return;
    addCheckItem(v);
    $("#ckNew").value = "";
  };
  $("#ckAddBtn").onclick = addFn;
  $("#ckNew").onkeydown = e=>{ if(e.key==="Enter") addFn(); };
}
function toggleCheck(id){
  const it = DB.checklist.find(x=>x.id===id);
  if(!it) return;
  it.checked = !it.checked; save(); renderCheck();
}
function addCheckItem(label){
  DB.checklist.push({id:uid("ck"), label, checked:false}); save(); renderCheck();
}
function delCheckItem(id){
  DB.checklist = DB.checklist.filter(x=>x.id!==id); save(); renderCheck();
}

function renderSettings(){
  $("#setBody").innerHTML = `
    <div class="setblk">
      <h4>최신 정보 새로고침</h4>
      <p>화면이 오래돼 보이면 눌러보세요. 캐시를 건너뛰고 최신 버전을 새로 받아옵니다.</p>
      <button class="btn full" id="refreshBtn">↻ 최신 버전 받기</button>
    </div>
    <div class="setblk">
      <h4>화면 테마</h4>
      <button class="btn full" id="themeBtn">◐ 테마 전환</button>
    </div>
    <div class="setblk">
      <h4>백업</h4>
      <p>장소·체크리스트·메모를 JSON 파일로 저장하거나 불러옵니다.</p>
      <div class="btnrow">
        <button class="btn" id="expBtn">⬇︎ 내보내기</button>
        <button class="btn" id="impBtn">⬆︎ 불러오기</button>
      </div>
      <input type="file" id="impFile" accept="application/json,.json" class="hidden">
    </div>
    <div class="setblk">
      <h4>홈 화면에 추가</h4>
      <p>폰 브라우저에서 이 주소를 열고 <b>공유 → 홈 화면에 추가</b>하면 앱처럼 쓸 수 있어요.</p>
    </div>
    <div class="setblk">
      <h4>버전</h4>
      <p>v${APP_VERSION} (${APP_BUILT})</p>
    </div>
  `;
  $("#refreshBtn").onclick = ()=>{
    if("serviceWorker" in navigator){
      navigator.serviceWorker.getRegistrations().then(rs=> rs.forEach(r=>r.update()));
    }
    location.replace(location.pathname + "?v=" + Date.now());
  };
  $("#themeBtn").onclick = ()=> applyTheme(document.documentElement.dataset.theme==="light"?"dark":"light");
  $("#expBtn").onclick = ()=>{
    const blob = new Blob([backupJSON()], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `travelguide-backup_${todayISO()}.json`;
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    toast("백업 파일을 내려받았어요");
  };
  $("#impBtn").onclick = ()=> $("#impFile").click();
  $("#impFile").onchange = ev=>{
    const file = ev.target.files[0];
    if(!file) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      try{
        const inc = JSON.parse(fr.result);
        const added = mergeImport(inc);
        save(); renderCheck(); renderPlaces();
        toast(added ? `${added}개 장소를 합쳤어요` : "새로 추가할 내용이 없었어요");
      }catch(e){ toast("읽을 수 없는 백업 파일이에요"); }
      ev.target.value = "";
    };
    fr.readAsText(file);
  };
}

const VIEWS = { itin: renderItin, places: renderPlaces, check: renderCheck, set: renderSettings };
function go(v){
  const already = $(".tab.on") && $(".tab.on").dataset.v === v;
  if(already && v==="itin") itinView = "overview";
  $$(".view").forEach(el=> el.classList.add("hidden"));
  $("#v-"+v).classList.remove("hidden");
  $$(".tab").forEach(t=> t.classList.toggle("on", t.dataset.v===v));
  VIEWS[v]();
}
$$(".tab").forEach(t=> t.onclick = ()=>{ go(t.dataset.v); window.scrollTo({top:0,behavior:"smooth"}); });

function applyTheme(t){
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t==="light" ? "#f7f8fb" : "#0c1220";
  localStorage.setItem(THEME_KEY, t);
}
applyTheme(localStorage.getItem(THEME_KEY) || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));

/* 왼쪽 가장자리에서 오른쪽으로 스와이프하면 뒤로가기(시트 닫기 또는 일정 상세→전체 일정) */
function goBack(){
  if($("#sheetHost").firstElementChild){ closeSheet(); return; }
  if(itinView==="detail" && !$("#v-itin").classList.contains("hidden")){ itinView="overview"; renderItin(); }
}
(function initSwipeBack(){
  let sx=0, sy=0, tracking=false;
  document.addEventListener("touchstart", e=>{
    if(e.touches.length!==1) return;
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    tracking = sx < 60;
  }, {passive:true});
  document.addEventListener("touchend", e=>{
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    if(t.clientX - sx > 70 && Math.abs(t.clientY - sy) < 50) goBack();
  }, {passive:true});
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}

/* URL로 장소를 바로 추가하는 "퀵애드" 링크: ?add=<base64url JSON> 를 열면
   폰에서 직접 입력할 필요 없이 자동으로 장소가 저장된다. */
function b64urlToUtf8(b64url){
  const b64 = b64url.replace(/-/g,"+").replace(/_/g,"/");
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, c=>c.charCodeAt(0));
  return new TextDecoder("utf-8").decode(bytes);
}
function tryAddFromUrl(){
  const raw = new URLSearchParams(location.search).get("add");
  if(!raw) return 0;
  let added = 0;
  try{
    const items = JSON.parse(b64urlToUtf8(raw));
    (Array.isArray(items) ? items : [items]).forEach(p=>{
      if(!p || !p.name) return;
      const dup = DB.places.some(x=> x.name===p.name && (x.address||"")===(p.address||""));
      if(dup) return;
      DB.places.push({
        id: uid("pl"), createdAt: Date.now(),
        name: p.name, city: p.city || "기타", category: p.category || "etc",
        address: p.address || "", memo: p.memo || "",
      });
      added++;
    });
    if(added) save();
  }catch(e){ toast("추가 링크를 읽을 수 없어요"); }
  history.replaceState(null, "", location.pathname);
  return added;
}

const addedFromUrl = tryAddFromUrl();
if(addedFromUrl){
  toast(`${addedFromUrl}개 장소를 추가했어요`);
  go("places");
} else {
  renderItin();
}
</script>
